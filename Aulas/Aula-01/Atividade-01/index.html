<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jogo da Velha</title>

    <link rel="stylesheet" href="/Aulas/Atividade01/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="player left">
        <h2>JOGADOR Nº1</h2>

        <div id="xScore" class="score">0</div>
      </div>

      <h1>JOGO DA VELHA</h1>

      <div class="player right">
        <h2>JOGADOR Nº2</h2>

        <div id="oScore" class="score">0</div>
      </div>
    </header>

    <main>
      <div class="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>

        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>

        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
    </main>

    <button id="restart">Novo Jogo</button>

    <div id="toastContainer"></div>

    <script src="/Aulas/Atividade01/script.js"></script>
  </body>
</html>
